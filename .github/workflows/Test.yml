name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test PalServerMetricsExporter
        run: dotnet test PalServerMetricsExporter.Test/PalServerMetricsExporter.Test.csproj

      - name: Build Image
        env:
          IMAGE_PUBLISH: false
        run: ./image-build.sh
