name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Image
        env:
          IMAGE_PUBLISH: false
        run: ./image-build.sh
