name: Publish

on:
  workflow_dispatch:

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_PUBLISH: true
        run: ./image-build.sh
